[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-data-quality"
version = "0.1.0"
description = "A tool to generate and validate synthetic tabular data using classical statistics."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "faker>=19.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
